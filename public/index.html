<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoryForge Studio</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">STORYFORGE <small>STORY / UI / FLOW STUDIO</small></div><nav><button class="tab active" data-tab="flow">플로우</button><button class="tab" data-tab="content">콘텐츠</button><button class="tab" data-tab="ui">게임 UI</button><button class="tab" data-tab="play">플레이</button></nav><div class="head-actions"><span id="saveState">—</span><button id="exportBtn">내보내기</button><label class="import-btn">가져오기<input id="importInput" type="file" accept="application/json"></label><button id="saveBtn">저장</button></div></header>
<main>
<section id="flow" class="page active"><aside class="left-panel"><div class="panel-title">STORY NODES <button id="addNode">＋</button></div><input id="searchNodes" placeholder="노드 검색"><div id="nodeList"></div></aside><div class="flow-work"><div class="toolbar"><button id="newStory">＋ 스토리</button><button id="newChoiceNode">＋ 선택지 노드</button><button id="newEnding">＋ 엔딩</button><button id="fitGraph">전체 보기</button><span class="hint">노드를 드래그하고, 선택지의 연결 대상을 지정하세요.</span></div><div id="graph" class="graph"></div></div><aside class="right-panel"><div class="panel-title">NODE INSPECTOR</div><div id="inspector"></div></aside></section>
<section id="content" class="page"><div class="content-grid"><div><div class="panel-title">VARIABLES <button id="addVar">＋</button></div><div id="variables"></div></div><div><div class="panel-title">ASSETS / DATA</div><div class="card"><p>노드와 선택지는 무제한으로 추가할 수 있습니다. 변수는 조건과 효과식에 사용할 수 있습니다.</p><div id="stats"></div></div></div></div></section>
<section id="ui" class="page"><div class="ui-editor"><div><div class="panel-title">GAME UI THEME</div><div id="uiControls"></div></div><div class="ui-preview"><div class="preview-label">LIVE PREVIEW</div><div id="uiPreview"></div></div></div></section>
<section id="play" class="page"><div class="play-shell"><div class="play-top"><strong id="playTitle">플레이 테스트</strong><button id="restartPlay">처음부터</button></div><div id="gameScreen"></div></div></section>
</main><script src="app.js?v=2"></script></body></html>
